<div class="forozeekr-chrome" data-forozeekr-chrome>
  <div class="forozeekr-ad forozeekr-ad--top" data-ad-slot="top-leaderboard" aria-label="Espacio publicitario">
    <span class="forozeekr-ad__label">Publicidad</span>
    <span class="forozeekr-ad__hint">728×90 / responsive — hueco listo para AdSense / network</span>
  </div>

  <section class="forozeekr-hero" data-forozeekr-hero aria-label="Modelos Zeekr">
    <div class="forozeekr-hero__inner">
      <div class="forozeekr-hero__copy">
        <p class="forozeekr-hero__eyebrow">Club de propietarios · España</p>
        <h1 class="forozeekr-hero__title">Foro Zeekr</h1>
        <p class="forozeekr-hero__lede">
          Comunidad de propietarios Zeekr en español — modelos, pedidos, carga y encuentros.
        </p>
      </div>

      <div class="forozeekr-hero__models" role="list">
        <a class="forozeekr-model" role="listitem" href="/c/modelos-zeekr" style="--model-tone:#1a1d1f">
          <span class="forozeekr-model__name">9X</span>
          <span class="forozeekr-model__tag">Luxury</span>
        </a>
        <a class="forozeekr-model" role="listitem" href="/c/modelos-zeekr" style="--model-tone:#24292b">
          <span class="forozeekr-model__name">7X</span>
          <span class="forozeekr-model__tag">SUV</span>
        </a>
        <a class="forozeekr-model" role="listitem" href="/c/modelos-zeekr" style="--model-tone:#2e3335">
          <span class="forozeekr-model__name">7GT</span>
          <span class="forozeekr-model__tag">Performance</span>
        </a>
        <a class="forozeekr-model" role="listitem" href="/c/modelos-zeekr" style="--model-tone:#353738">
          <span class="forozeekr-model__name">X</span>
          <span class="forozeekr-model__tag">Urban</span>
        </a>
        <a class="forozeekr-model" role="listitem" href="/c/modelos-zeekr" style="--model-tone:#414445">
          <span class="forozeekr-model__name">001</span>
          <span class="forozeekr-model__tag">Shooting brake</span>
        </a>
      </div>
    </div>

    <aside class="forozeekr-ad forozeekr-ad--rail" data-ad-slot="home-rail" aria-label="Espacio publicitario lateral">
      <span class="forozeekr-ad__label">Publicidad</span>
      <span class="forozeekr-ad__hint">300×250</span>
    </aside>
  </section>
</div>
